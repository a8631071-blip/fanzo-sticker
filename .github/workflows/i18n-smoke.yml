name: i18n-smoke

on:
  push:
    branches:
      - i18n-zh-en-phase1

permissions:
  contents: write

jobs:
  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-zh-en-phase1
          fetch-depth: 0

      - name: Harden shared i18n patch
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path('assets/i18n.js')
          text = path.read_text(encoding='utf-8')
          old_css = '@media(max-width:700px){#fanzo-i18n-switcher.fanzo-sticker{margin-right:0;}header .version{display:none!important;}}'
          new_css = '@media(max-width:700px){#fanzo-i18n-switcher.fanzo-sticker{margin-right:0;}.fanzo-sticker-page header .version{display:none!important;}}'
          text = text.replace(old_css, new_css, 1)
          new_mount = "    const pagePath = location.pathname;\n    let target = null;\n    if (pagePath.includes('/sticker/')) {\n      target = document.querySelector('header') || document.body;\n      box.classList.add('fanzo-sticker');\n      document.documentElement.classList.add('fanzo-sticker-page');\n    } else if (pagePath.includes('/line-check/')) {\n      target = document.querySelector('.left .box') || document.body;\n      box.classList.add('fanzo-block');\n    } else if (pagePath.includes('/qr/')) {\n      target = document.querySelector('.hero-copy') || document.body;\n      box.classList.add('fanzo-block');\n    } else if (pagePath.includes('/collage/')) {\n      target = document.querySelector('.tool-brand') || document.body;\n      box.classList.add('fanzo-block');\n    } else {\n      target = document.querySelector('.topbar') || document.body;\n      box.classList.add('fanzo-home');\n    }\n    (target || document.body).appendChild(box);"
          if "const pagePath = location.pathname;" not in text:
              pattern = r"    let target = null;\n    if \(document\.querySelector\('\.topbar'\)\) \{.*?\n    \}\n    \(target \|\| document\.body\)\.appendChild\(box\);"
              text, count = re.subn(pattern, new_mount, text, count=1, flags=re.S)
              assert count == 1, 'mount block replacement failed'
          metadata_anchor = "    } else if (document.documentElement.dataset.i18nTitleSource) {\n      document.title = document.documentElement.dataset.i18nTitleSource;\n    }\n\n    const counter = document.querySelector('img[src*=\"hits.sh\"]');"
          metadata_new = "    } else if (document.documentElement.dataset.i18nTitleSource) {\n      document.title = document.documentElement.dataset.i18nTitleSource;\n    }\n\n    document.querySelectorAll('head meta[content], head [title], head [aria-label]').forEach(translateAttributes);\n\n    const counter = document.querySelector('img[src*=\"hits.sh\"]');"
          if "head meta[content]" not in text:
              assert metadata_anchor in text, 'metadata anchor missing'
              text = text.replace(metadata_anchor, metadata_new, 1)
          dynamic_anchor = "  const EXACT_DYNAMIC = new Map([\n"
          residual_entries = "    ['煩躁胖子', 'Fanzo'],\n    ['｜貼圖工作站', ' | Sticker Workshop'],\n    ['本工具免費提供使用，原始碼同步公開於', 'These tools are free to use. The source code is available on'],\n    ['，採 MIT License 授權。', ' under the MIT License.'],\n    ['素材拼板', 'Collage Board'],\n    ['工程日誌：2026-07-24 建立 0724V3，新增整面背景圖大膽版、背景圖濃度控制與定位角保護重畫。', 'Engineering log: 2026-07-24 created 0724V3 with full-image bold mode, background-image strength control, and protected finder-pattern redraw.'],\n    ['LINE主題', 'LINE themes'],\n    ['· 點擊每張貼圖下方的', '· Click the'],\n    ['· 點擊', '· Click'],\n    ['・免費公開版工具', ' · Free Public Tools'],\n    ['共', 'Total'],\n    ['成功 48×48', 'Ready 48×48'],\n    ['成功 96×96', 'Ready 96×96'],\n    ['更新日期 2026/07/11', 'Updated 2026/07/11'],\n    ['格 · 每格約', 'cells · approx.'],\n    ['設定封面圖', 'button below each sticker to set the cover image'],\n    ['設定標籤圖', 'to set the tab image'],\n    ['選擇圖片', 'Choose image'],\n"
          if "['工程日誌：2026-07-24 建立 0724V3" not in text:
              assert dynamic_anchor in text, 'dynamic translation anchor missing'
              text = text.replace(dynamic_anchor, dynamic_anchor + residual_entries, 1)
          path.write_text(text, encoding='utf-8')
          assert new_css in text
          assert "const pagePath = location.pathname;" in text
          assert "head meta[content]" in text
          assert "['選擇圖片', 'Choose image']" in text
          print('i18n residual patch: PASS')

      - name: Start local site
        run: |
          python3 -m http.server 8765 > /tmp/fanzo-http.log 2>&1 &
          echo $! > /tmp/fanzo-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:8765/assets/i18n.js >/dev/null

      - name: English UI smoke check in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          mkdir -p /tmp/i18n-smoke
          check_page(){
            path="$1"; expected="$2"; name="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --lang=en-US --user-data-dir="/tmp/chrome-$name" --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/$path" > "/tmp/i18n-smoke/$name.html" 2> "/tmp/i18n-smoke/$name.err"
            grep -q 'id="fanzo-i18n-switcher"' "/tmp/i18n-smoke/$name.html" || { echo "$name switcher missing"; exit 1; }
            grep -Fq "$expected" "/tmp/i18n-smoke/$name.html" || { echo "$name expected English text missing"; exit 1; }
            grep -q '<html[^>]*lang="en"' "/tmp/i18n-smoke/$name.html" || { echo "$name html lang not en"; exit 1; }
            if grep -Eqi 'Uncaught|SyntaxError|ReferenceError|TypeError' "/tmp/i18n-smoke/$name.err"; then
              echo "$name runtime error"
              cat "/tmp/i18n-smoke/$name.err"
              exit 1
            fi
            echo "$name: PASS"
          }
          check_page 'index.html' 'Four Free Tools' home
          check_page 'sticker/index.html' 'Background removal' sticker
          check_page 'line-check/index.html' 'LINE Final Visual Check' linecheck
          check_page 'qr/index.html' 'URL QR Code Generator' qr
          check_page 'collage/index.html' '1. Import &amp; Layout' collage

      - name: Verify two-way switching and persistence
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-toggle about:blank >/tmp/chrome-toggle.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:9222/json >/dev/null && break; sleep 0.25; done
          node -e "if(typeof WebSocket!=='function') process.exit(2)"
          cat > /tmp/toggle-test.mjs <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const targets = await (await fetch('http://127.0.0.1:9222/json')).json();
          if (!targets.length) throw new Error('No Chrome CDP target');
          const ws = new WebSocket(targets[0].webSocketDebuggerUrl);
          await new Promise((resolve, reject) => { ws.addEventListener('open', resolve, {once:true}); ws.addEventListener('error', reject, {once:true}); });
          let nextId = 1;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const data = JSON.parse(event.data);
            if (!data.id || !pending.has(data.id)) return;
            const {resolve, reject} = pending.get(data.id);
            pending.delete(data.id);
            if (data.error) reject(new Error(data.error.message)); else resolve(data.result);
          });
          function send(method, params={}) {
            const id = nextId++;
            return new Promise((resolve, reject) => { pending.set(id, {resolve, reject}); ws.send(JSON.stringify({id, method, params})); });
          }
          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', {expression, returnByValue:true, awaitPromise:true});
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Runtime evaluate failed');
            return result.result.value;
          }
          async function navigate(url) {
            await send('Page.navigate', {url});
            for (let i=0; i<40; i++) {
              await sleep(150);
              const ready = await evaluate("document.readyState === 'complete' && !!window.FanzoI18n && !!document.getElementById('fanzo-language-select')");
              if (ready) return;
            }
            throw new Error('Page did not become i18n-ready: ' + url);
          }
          await send('Page.enable');
          await send('Runtime.enable');
          const pages = [
            ['index.html','四個免費工具','Four Free Tools'],
            ['sticker/index.html','上傳','Upload'],
            ['line-check/index.html','匯入與規格','Import & Specs'],
            ['qr/index.html','控制區','Controls'],
            ['collage/index.html','1. 匯入與排列','1. Import & Layout']
          ];
          for (const [path, zh, en] of pages) {
            const url = 'http://127.0.0.1:8765/' + path;
            await navigate(url);
            const zhState = await evaluate(`(()=>{FanzoI18n.setLanguage('zh-TW');return {lang:document.documentElement.lang,stored:localStorage.getItem('fanzo-language'),select:document.getElementById('fanzo-language-select').value,text:document.body.innerText.includes(${JSON.stringify(zh)})}})()`);
            if (!(zhState.lang === 'zh-Hant-TW' && zhState.stored === 'zh-TW' && zhState.select === 'zh-TW' && zhState.text)) throw new Error(path + ' zh-TW switch failed: ' + JSON.stringify(zhState));
            const enState = await evaluate(`(()=>{FanzoI18n.setLanguage('en');return {lang:document.documentElement.lang,stored:localStorage.getItem('fanzo-language'),select:document.getElementById('fanzo-language-select').value,text:document.body.innerText.includes(${JSON.stringify(en)})}})()`);
            if (!(enState.lang === 'en' && enState.stored === 'en' && enState.select === 'en' && enState.text)) throw new Error(path + ' en switch failed: ' + JSON.stringify(enState));
            await send('Page.reload', {ignoreCache:true});
            await sleep(700);
            const persisted = await evaluate(`({stored:localStorage.getItem('fanzo-language'),select:document.getElementById('fanzo-language-select')?.value,text:document.body.innerText.includes(${JSON.stringify(en)})})`);
            if (!(persisted.stored === 'en' && persisted.select === 'en' && persisted.text)) throw new Error(path + ' persistence failed: ' + JSON.stringify(persisted));
            console.log(path + ': two-way + persistence PASS');
          }
          ws.close();
          NODE
          node /tmp/toggle-test.mjs

      - name: Audit residual Traditional Chinese in English UI
        shell: python
        run: |
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          CJK = re.compile(r'[\u3400-\u9fff]')
          IGNORE_TAGS = {'script','style','pre','code','textarea','template'}
          IGNORE_CLASSES = {'featured-title','featured-desc','asset-name','devlog-panel'}
          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.residual = set()
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  classes = set(data.get('class','').split())
                  inherited = self.stack[-1] if self.stack else False
                  ignored = inherited or tag in IGNORE_TAGS or bool(classes & IGNORE_CLASSES) or data.get('id') == 'devlog-v91' or 'data-i18n-ignore' in data
                  self.stack.append(ignored)
                  if not ignored:
                      for key in ('title','aria-label','placeholder','alt','content'):
                          if key == 'alt' and 'featured-img' in classes: continue
                          value = data.get(key,'') or ''
                          if CJK.search(value): self.residual.add(f'@{key}: {value.strip()}')
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  self.handle_endtag(tag)
              def handle_endtag(self, tag):
                  if self.stack: self.stack.pop()
              def handle_data(self, data):
                  if self.stack and self.stack[-1]: return
                  text = ' '.join(data.split())
                  if text and CJK.search(text): self.residual.add(text)
          failed = False
          for file in sorted(Path('/tmp/i18n-smoke').glob('*.html')):
              parser = AuditParser()
              parser.feed(file.read_text(encoding='utf-8', errors='replace'))
              if parser.residual:
                  failed = True
                  print(f'{file.stem}: residual CJK ({len(parser.residual)})')
                  for item in sorted(parser.residual): print('  -', item)
              else:
                  print(f'{file.stem}: residual CJK audit PASS')
          if failed: raise SystemExit(1)

      - name: Static integrity check
        run: |
          node --check assets/i18n.js
          python3 - <<'PY'
          from pathlib import Path
          expected = {'index.html':'assets/i18n.js','sticker/index.html':'../assets/i18n.js','line-check/index.html':'../assets/i18n.js','qr/index.html':'../assets/i18n.js','collage/index.html':'../assets/i18n.js'}
          for path, src in expected.items():
              text=Path(path).read_text(encoding='utf-8')
              assert text.count(f'<script src="{src}"></script>') == 1
          text = Path('assets/i18n.js').read_text(encoding='utf-8')
          assert '.fanzo-sticker-page header .version' in text
          assert "const pagePath = location.pathname;" in text
          assert "head meta[content]" in text
          assert "['選擇圖片', 'Choose image']" in text
          print('static integrity: PASS')
          PY

      - name: Commit hardened i18n if changed
        run: |
          git config user.name "fanzo-i18n-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js
          if git diff --cached --quiet; then
            echo "No i18n changes to commit"
            exit 0
          fi
          git commit -m "[i18n-patch] complete initial English UI coverage"
          git push origin HEAD:i18n-zh-en-phase1
