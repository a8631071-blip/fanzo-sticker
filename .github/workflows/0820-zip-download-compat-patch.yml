          new_button = old_button + '''
        <div id="zip-download-status" class="info-box" style="display:none;width:100%;margin:0;text-align:left;"></div>'''
          html = replace_once(html, old_button, new_button, 'ZIP status UI')

          old_log = '''  <pre>
0711V22｜2026-07-11｜三頁獨立輪播＋成品排版'''
          new_log = '''  <pre>
0820V23｜2026-08-20｜行動內建瀏覽器 ZIP 下載相容修正
- 修正 Threads／Instagram／Facebook 等內建瀏覽器對 Blob ZIP 下載不穩定：切割完成後背景預先建立 ZIP；下載時若支援檔案分享，優先開啟系統分享，否則回退既有 FileSaver／原生下載。
- 下載流程新增明確狀態與錯誤提示；內建瀏覽器沒有可用檔案分享時，提示改用右上角「在瀏覽器中開啟」。
- ZIP 快取會在切割設定失效、檔名碼數、起始編號、Main／Tab 選取變更時同步失效並重建，避免下載舊內容。
- 保留去 Gemini 浮水印、傳統去背、魔術棒、手拉切線、切割、成品排版、檔名、Main／Tab 與 ZIP 內容結構不變。

0711V22｜2026-07-11｜三頁獨立輪播＋成品排版'''
          html = replace_once(html, old_log, new_log, 'hidden engineering log')

          helper_anchor = '''// ===== 輸出尺寸設定 =====
let outputW = 370, outputH = 320;
let outputDigits = 2;'''
          helper_code = r'''// ===== 0820V23｜ZIP 下載相容層 =====
let preparedStickerZipBlob = null;
let preparedStickerZipSignature = '';
let preparedStickerZipPromise = null;
let preparedStickerZipPromiseSignature = '';

function zipCompatText(zh, en) {
  return String(document.documentElement.lang || '').toLowerCase().startsWith('en') ? en : zh;
}

function setZipDownloadStatus(message, level = 'info') {
  const el = document.getElementById('zip-download-status');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = message;
  el.style.color = level === 'error' ? '#ff8a8a' : (level === 'ok' ? 'var(--accent3)' : 'var(--accent2)');
}

function isInAppBrowser(ua = navigator.userAgent || '') {
  return /Threads|Instagram|FBAN|FBAV|FB_IAB|Line\/|MicroMessenger|;\s*wv\)|\bwv\b/i.test(String(ua));
}

function getStickerZipSignature() {
  const startNum = parseInt(document.getElementById('start-num')?.value || '1') || 1;
  return [
    startNum,
    outputDigits,
    mainId || 0,
    tabId || 0,
    finalImages.length,
    finalImages.map(img => `${img.id}:${String(img.dataUrl || '').length}`).join(',')
  ].join('|');
}

function invalidatePreparedStickerZip() {
  preparedStickerZipBlob = null;
  preparedStickerZipSignature = '';
  preparedStickerZipPromise = null;
  preparedStickerZipPromiseSignature = '';
}

async function buildStickerZipBlob() {
  if (typeof JSZip !== 'function') throw new Error('JSZip 尚未載入');
  const startNum = parseInt(document.getElementById('start-num')?.value || '1') || 1;
  const zip = new JSZip();
  finalImages.forEach(img => {
    const base64 = String(img.dataUrl || '').split(',')[1];
    if (!base64) throw new Error(`格 ${img.id} 沒有可輸出的 PNG 資料`);
    zip.file(`${(startNum + img.id - 1).toString().padStart(outputDigits, '0')}.png`, base64, { base64: true });
  });
  if (mainId) {
    const m = finalImages.find(i => i.id === mainId);
    if (m) zip.file('main.png', await resizeImg(m.dataUrl, 240, 240), { base64: true });
  }
  if (tabId) {
    const t = finalImages.find(i => i.id === tabId);
    if (t) zip.file('tab.png', await resizeImg(t.dataUrl, 96, 74), { base64: true });
  }
  return zip.generateAsync({ type: 'blob' });
}

function prepareStickerZipInBackground() {
  if (!finalImages.length) return Promise.resolve(null);
  const signature = getStickerZipSignature();
  if (preparedStickerZipBlob && preparedStickerZipSignature === signature) {
    return Promise.resolve(preparedStickerZipBlob);
  }
  if (preparedStickerZipPromise && preparedStickerZipPromiseSignature === signature) {
    return preparedStickerZipPromise;
  }
  preparedStickerZipPromiseSignature = signature;
  preparedStickerZipPromise = buildStickerZipBlob()
    .then(blob => {
      if (getStickerZipSignature() === signature) {
        preparedStickerZipBlob = blob;
        preparedStickerZipSignature = signature;
      }
      return blob;
    })
    .catch(err => {
      console.error('ZIP 預先建立失敗', err);
      if (getStickerZipSignature() === signature) {
        setZipDownloadStatus(zipCompatText(
          `ZIP 建立失敗：${err?.message || err}`,
          `ZIP build failed: ${err?.message || err}`
        ), 'error');
      }
      throw err;
    })
    .finally(() => {
      if (preparedStickerZipPromiseSignature === signature) {
        preparedStickerZipPromise = null;
        preparedStickerZipPromiseSignature = '';
      }
    });
  return preparedStickerZipPromise;
}

function triggerNativeBlobDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function fallbackStickerZipDownload(blob, filename, inApp) {
  try {
    if (typeof saveAs === 'function') saveAs(blob, filename);
    else triggerNativeBlobDownload(blob, filename);
    setZipDownloadStatus(
      inApp
        ? zipCompatText(
            '已嘗試下載 ZIP。若內建瀏覽器沒有出現檔案，請用右上角選單「在瀏覽器中開啟」後再按下載。',
            'ZIP download was requested. If no file appears in the in-app browser, use its menu to open this page in your browser and download again.'
          )
        : zipCompatText('ZIP 下載已送出。', 'ZIP download started.'),
      inApp ? 'info' : 'ok'
    );
  } catch (err) {
    console.error('ZIP 下載失敗', err);
    setZipDownloadStatus(zipCompatText(
      '目前瀏覽器無法儲存 ZIP。請用右上角選單「在瀏覽器中開啟」，再重新按下載 ZIP。',
      'This browser cannot save the ZIP. Open this page in your browser from the app menu, then download the ZIP again.'
    ), 'error');
  }
}

function deliverPreparedStickerZip(blob) {
  const filename = 'stickers.zip';
  const inApp = isInAppBrowser();
  let file = null;
  try {
    file = new File([blob], filename, { type: 'application/zip' });
  } catch (err) {
    console.warn('File API unavailable', err);
  }

  let canShareFiles = false;
  try {
    canShareFiles = !!(inApp && file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
  } catch (err) {
    canShareFiles = false;
  }

  if (canShareFiles) {
    setZipDownloadStatus(zipCompatText('正在開啟系統分享…', 'Opening the system share sheet…'));
    try {
      const sharePromise = navigator.share({
        files: [file],
        title: filename
      });
      Promise.resolve(sharePromise)
        .then(() => setZipDownloadStatus(zipCompatText('ZIP 已交給系統分享。', 'ZIP sent to the system share sheet.'), 'ok'))
        .catch(err => {
          if (err?.name === 'AbortError') {
            setZipDownloadStatus(zipCompatText('已取消分享。ZIP 仍保留，可再按一次下載。', 'Share cancelled. The ZIP is still ready; press Download ZIP again.'));
            return;
          }
          console.warn('系統分享失敗，改用下載 fallback', err);
          fallbackStickerZipDownload(blob, filename, true);
        });
      return;
    } catch (err) {
      console.warn('系統分享啟動失敗，改用下載 fallback', err);
    }
  }

  fallbackStickerZipDownload(blob, filename, inApp);
}

window.addEventListener('load', () => {
  if (isInAppBrowser()) {
    setZipDownloadStatus(zipCompatText(
      '偵測到社群 App 內建瀏覽器。ZIP 準備完成後，下載時會優先開啟系統分享；若未支援，請用右上角選單「在瀏覽器中開啟」。',
      'An in-app browser was detected. When the ZIP is ready, Download ZIP will prefer the system share sheet; if unsupported, open this page in your browser from the app menu.'
    ));
  }
});

// ===== 輸出尺寸設定 =====
let outputW = 370, outputH = 320;
let outputDigits = 2;'''
