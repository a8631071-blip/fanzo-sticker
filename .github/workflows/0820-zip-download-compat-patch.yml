name: 0820-zip-download-compat-patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/0820-zip-download-compat-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public sticker ZIP download flow
        shell: bash
        run: |
