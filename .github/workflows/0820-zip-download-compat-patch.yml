      - name: Headless Chrome functional regression
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-zip http://127.0.0.1:8765/sticker/index.html >/tmp/chrome-zip.log 2>&1 &
