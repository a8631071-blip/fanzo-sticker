}'''
          html = replace_once(html, old_download, new_download, 'downloadZip replacement')

          readme_anchor = '''Designed for creators who need to process multiple assets and reduce repetitive manual work.

### 02. LINE 上架檔案檢查｜LINE Pre-Publish File Check'''
          readme_new = '''Designed for creators who need to process multiple assets and reduce repetitive manual work.

**行動瀏覽器相容性：** Threads／Instagram／Facebook 等 App 內建瀏覽器可能限制 Blob ZIP 下載。公開版在 ZIP 預先建立完成後，若瀏覽器支援檔案分享會優先開啟系統分享；不支援時會提供明確提示，建議改用 App 選單的「在瀏覽器中開啟」後下載。

**Mobile browser compatibility:** In-app browsers such as Threads, Instagram, and Facebook may restrict Blob ZIP downloads. After the ZIP is prepared, the public tool prefers the system file-share sheet when supported; otherwise it shows a clear fallback message and recommends opening the page in the device browser.

### 02. LINE 上架檔案檢查｜LINE Pre-Publish File Check'''
          readme = replace_once(readme, readme_anchor, readme_new, 'README mobile ZIP note')

          log_text = '''# 0820 ZIP 下載相容修正｜0820V23

## 基底版本
- `sticker/index.html`：0711V22 公開版。
- 公開網站部署：GitHub Pages / `main`。

## 修改項目
- 修正 Threads／Instagram／Facebook 等內建瀏覽器對 Blob ZIP 下載不穩定的出口。
- 切割完成後背景預先建立 `stickers.zip`，讓真正的下載按鈕點擊能在仍有使用者手勢時直接呼叫系統檔案分享。
- 內建瀏覽器若支援 Web Share + files，優先開啟系統分享；否則保留 FileSaver／原生 `<a download>` fallback，並顯示外部瀏覽器提示。
- 檔名碼數、起始編號、Main／Tab 或切割內容變動時，ZIP 快取同步失效並重建，避免送出舊 ZIP。
- `README.md` 補行動內建瀏覽器相容說明。
- 公開顯示更新日期改為 2026/08/20；隱藏工程日誌新增 0820V23。

## 未修改
- 不修改去 Gemini 浮水印核心。
- 不修改傳統去背／魔術棒去背。
- 不修改切割、手拉切線、成品排版、輸出尺寸與檔名規則。
- 不修改 Main／Tab 尺寸與 ZIP 內檔案結構。
- 不修改 MIT License。
- 不重寫整份工具。

## 風險點
- 部分 App WebView 可能同時不支援 Web Share 檔案與 `<a download>`；此情況無法由純前端強制繞過，工具會明確提示改用系統瀏覽器。
- JSZip 與 FileSaver 仍沿用既有 CDN；本次不做第三方套件本地化，避免把下載相容修正擴成供應鏈／授權檔案調整。

## 驗收
- Workflow 會執行 HTML inline JavaScript 語法檢查。
- Headless Chrome 實際載入 `/sticker/`，檢查既有核心函式仍存在。
- 以測試 PNG 實際建立 ZIP，驗證 `01.png`。
