      - name: Static syntax and patch assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('sticker/index.html').read_text(encoding='utf-8')
          required = [
            '0820V23｜2026-08-20｜行動內建瀏覽器 ZIP 下載相容修正',
            'function isInAppBrowser',
            'function prepareStickerZipInBackground',
            'function deliverPreparedStickerZip',
            'id="zip-download-status"',
            "tag.textContent = '更新日期 2026/08/20'"
          ]
          for item in required:
            if item not in html:
              raise SystemExit('missing patch marker: ' + item)
          if 'zip.generateAsync({ type: \'blob\' }).then(c => saveAs(c, \'stickers.zip\'))' in html:
            raise SystemExit('old direct ZIP save path still present')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
            raise SystemExit('no inline scripts found')
          for idx, script in enumerate(scripts, 1):
            p = Path(tempfile.gettempdir()) / f'fanzo-inline-{idx}.js'
            p.write_text(script, encoding='utf-8')
            subprocess.run(['node', '--check', str(p)], check=True)
          print(f'inline scripts syntax PASS: {len(scripts)} blocks')
          PY
          grep -Fq 'Threads／Instagram／Facebook 等 App 內建瀏覽器可能限制 Blob ZIP 下載' README.md
          grep -Fq '不修改 MIT License' .ai_patch/0820_ZIP_DOWNLOAD_COMPAT.md
