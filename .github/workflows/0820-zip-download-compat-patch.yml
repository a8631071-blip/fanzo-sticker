          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const targets = await (await fetch('http://127.0.0.1:9222/json')).json();
          const target = targets.find(t => t.type === 'page' && t.url.includes('127.0.0.1:8765/sticker/index.html'));
          if (!target) throw new Error('site page target missing');
          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => { ws.addEventListener('open', resolve, {once:true}); ws.addEventListener('error', reject, {once:true}); });
          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const msg = JSON.parse(event.data);
            if (!msg.id || !pending.has(msg.id)) return;
            const p = pending.get(msg.id); pending.delete(msg.id);
            msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result);
          });
          const send = (method, params={}) => new Promise((resolve,reject) => { const n=++id; pending.set(n,{resolve,reject}); ws.send(JSON.stringify({id:n,method,params})); });
          async function evalValue(expression){
            const out = await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            if(out.exceptionDetails) throw new Error(out.exceptionDetails.text || JSON.stringify(out.exceptionDetails));
            return out.result.value;
          }
          for(let i=0;i<120;i++){
            const ready = await evalValue("document.readyState==='complete' && typeof JSZip==='function' && typeof downloadZip==='function' && typeof prepareStickerZipInBackground==='function'");
            if(ready) break;
            await sleep(100);
            if(i===119) throw new Error('page/JSZip not ready');
          }
          const core = await evalValue(`({
            start:typeof startProcess,
            download:typeof downloadZip,
            preview:typeof runPreview,
            starBatch:typeof starProcessBatch,
            main:typeof selMain,
            tab:typeof selTab,
            inAppThreads:isInAppBrowser('Mozilla/5.0 Threads'),
