          readme = readme_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # Public update date only; no engineering version is exposed in the header.
          if html.count('更新日期 2026/07/11') != 2:
              raise SystemExit('update date: expected exactly 2 old date matches')
          html = html.replace('更新日期 2026/07/11', '更新日期 2026/08/20')

